name: Validate plain-language-product-copy

on:
  workflow_dispatch:
  push:
    paths:
      - "skills/plain-language-product-copy/**"
      - "scripts/**"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    paths:
      - "skills/plain-language-product-copy/**"
      - "scripts/**"
      - ".github/workflows/validate-skill.yml"

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and package skill
        run: python scripts/validate_skill.py skills/plain-language-product-copy dist/plain-language-product-copy.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: plain-language-product-copy
          path: dist/plain-language-product-copy.zip
          if-no-files-found: error
          retention-days: 30
